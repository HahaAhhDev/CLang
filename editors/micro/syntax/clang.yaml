filetype: clang

detect:
    filename: "\\.clng$"

rules:
    - comment:
        start: "#"
        end: "$"
        rules: []

    - identifier:
        start: "var:"
        end: "[A-Za-z_][A-Za-z0-9_]*"
        rules: []

    - special:
        start: "fn::"
        end: "[A-Za-z_][A-Za-z0-9_]*"
        rules: []

    - statement: "\\b(if|else|for|in|return|run|loop|stop|skip|safe|select|is)\\b"

    - identifier.macro: "\\b(emit|cap_first|lower|upper|contains|len|split|join|trim|replace|starts_with|ends_with|abs|floor|ceil|sqrt|pow|min|max|str|num|assert|file_read|file_write|json_parse|json_dump|http_get|http_post|http_serve|db_put|db_get|db_list|tbl_put|tbl_get|tbl_list|tbl_del|pmap|both|either|flip|pick|soft|keep|conv|why|fdiv|size_of|band|bor|bxor|bnot|range|exec|env|cli_args|time_now|sleep_ms|rand_seed|rand_int|is_str|is_num|is_list|is_map|type_of|keys|empty_list|mk_user|sort|push|pkg_fetch)\\b"

    - constant.string:
        start: "(f|r|fr|rf)?\""
        end: "\""
        skip: "\\\\."
        rules:
            - special: "\\{[^}]+\\}"

    - constant.number: "\\b[0-9]+(\\.[0-9]+)?\\b"

    - constant.bool: "\\b(true|false|null)\\b"
