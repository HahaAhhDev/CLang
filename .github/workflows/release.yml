name: release
on:
  push:
    tags:
      - "v*"
jobs:
  assets:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: ensure release exists
        run: gh release view ${{ github.ref_name }} --json tagName -q .tagName || gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: upload unix binary
        if: matrix.os == 'ubuntu-latest'
        run: cp target/release/clng clng-linux-x86_64 && gh release upload ${{ github.ref_name }} clng-linux-x86_64 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: upload windows binary
        if: matrix.os == 'windows-latest'
        run: cp target/release/clng.exe clng-windows-x86_64.exe && gh release upload ${{ github.ref_name }} clng-windows-x86_64.exe --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
