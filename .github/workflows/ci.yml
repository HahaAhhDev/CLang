name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all
      - run: cargo build --release
      - run: python3 tools/secular
      - run: ./target/debug/clng examples/hello.clng
      - run: ./target/debug/clng examples/calculator.clng
      - run: ./target/debug/clng examples/contacts.clng
