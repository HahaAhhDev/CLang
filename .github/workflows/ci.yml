name: ci
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all
      - run: cargo build --release
      - run: python3 tools/secular
      - run: ./target/debug/clng examples/hello.clng
        shell: bash
      - run: ./target/debug/clng examples/calculator.clng
        shell: bash
      - run: ./target/debug/clng examples/contacts.clng
        shell: bash
      - run: ./target/debug/clng fmt examples/hello.clng
        shell: bash
